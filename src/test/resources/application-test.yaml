spring:
  datasource:
    url: jdbc:mysql://localhost:3307/backend
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:test-cloud}
  api-key: ${CLOUDINARY_API_KEY:123456789012345}
  api-secret: ${CLOUDINARY_API_SECRET:mock_test_secret_for_environment_only}

jwt:
  signerKey: ${JWT_SIGNER_KEY:DummySignerKeyForTestEnvironmentOnlyDoNotUseInProd12345678901234567890}
  valid-duration: 7200
  refreshable-duration: 86400
